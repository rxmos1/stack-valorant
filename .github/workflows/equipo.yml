name: Estadisticas de equipo
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: write
concurrency:
  group: equipo
  cancel-in-progress: false
jobs:
  equipo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Calcular
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
        run: python equipo_stats.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add equipo.json
          git diff --staged --quiet || (git commit -m "Actualizar estadisticas de equipo" && git pull --rebase -q && git push)
