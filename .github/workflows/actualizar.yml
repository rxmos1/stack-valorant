name: Actualizar datos

on:
  schedule:
    - cron: "*/5 * * * *"    # comprueba cada 5 min; el script decide si hace peticiones (ver SILENCIO en valorant_amigos.py)
  workflow_dispatch:         # botón "Run workflow": actualización completa

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Descargar datos de Valorant
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "schedule" ]; then
            python valorant_amigos.py --no-abrir --rapido
          else
            python valorant_amigos.py --no-abrir
          fi
      - name: Guardar data.json
        run: |
          if [ -f resultados_valorant.json ]; then mv resultados_valorant.json data.json; fi
          rm -f resultados_valorant.md resultados_valorant.html
      - name: Subir cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos"
            git pull --rebase origin main
            git push
          fi
