name: Actualizar datos

on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 horas
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Descargar datos de Valorant
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
        run: python valorant_amigos.py --no-abrir
      - name: Guardar data.json
        run: |
          mv resultados_valorant.json data.json
          rm -f resultados_valorant.md resultados_valorant.html
      - name: Subir cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Actualizar datos"
          git push
